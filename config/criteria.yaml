# config/criteria.yaml
#
# Committed, not gitignored — criteria are neither secret nor personal, and
# committing them is what makes "why did I stop seeing infra postings?"
# answerable with `git log` (principle 3, docs/09-configuration.md).
#
# Schema: src/prefilter/domain/criteria.ts
# Rules and thresholds reasoned through in ADR-011.

titleBlocklist:
  - sênior
  - senior
  - pleno
  - especialista
  - coordenador
  - gerente
  - tech lead
  - III
  - IV

titleRequired:
  - estágio
  - estagiário
  - intern
  - trainee

location:
  # Rio de Janeiro and metropolitan region (CLAUDE.md §6).
  cities:
    - Rio de Janeiro
    - Niterói
    - São Gonçalo
    - Duque de Caxias
    - Nova Iguaçu
    - Belford Roxo
    - São João de Meriti
    - Itaboraí
    - Maricá
    - Mesquita
  allowRemote: true

blockedCompanies: []

# Minimum count of profile keywords that must appear in a posting's title
# (Posting has no description field yet — the check is title-only today,
# see src/prefilter/domain/pre-filter.ts) before it is worth stage A/B's LLM
# budget.
#
# Set to 0 after a real Gupy run (2026-08-14) showed this rejecting real,
# on-track postings — e.g. "Estágio em Desenvolvimento Backend" (remote,
# track dev) — because a short title rarely repeats a specific competency
# name like "Node.js" or "TypeScript" verbatim. Revisit once Posting carries
# a description stage A can read, or once track classification alone proves
# too coarse a signal.
minKeywordAdherence: 0

# Keyword classification per track, feeding trackAlignment (docs/04). A
# posting matching a track's list is classified into it; matching none
# leaves it unknown (trackWeights.unknown), not rejected.
tracks:
  dev:
    - backend
    - back-end
    - back end
    - node
    - node.js
    - nodejs
    - typescript
    - javascript
    - api
    - apis
    - desenvolvimento
    - desenvolvedor
    - software
    - fullstack
    - full-stack
    - programação
    - programador
  security:
    - segurança
    - security
    - infraestrutura
    - infrastructure
    - firewall
    - siem
    - soc
    - pentest
    - cibersegurança
    - ciber
  automation:
    - automação
    - automation
    - devops
    - sre
    - ci/cd
    - cicd
    - terraform
    - ansible
    - kubernetes
    - docker

# Phrases that veto a track even when one of its keywords matched (ADR-015).
# Every entry below was observed as a real false positive in the collected
# corpus, not imagined: "desenvolvimento" is the single most overloaded word
# in Brazilian job titles, and "segurança do trabalho" is a different
# profession from information security.
#
# Deliberately NOT excluded, because they are genuinely dev: "desenvolvimento
# backend", "desenvolvimento web", "desenvolvimento de sistemas",
# "desenvolvimento full stack", "análise e desenvolvimento de sistemas".
trackExclusions:
  dev:
    - desenvolvimento de embalagens
    - desenvolvimento humano
    - desenvolvimento organizacional
    - treinamento e desenvolvimento
    - desenvolvimento de produto
    - desenvolvimento de produtos
    - desenvolvimento comercial
    - desenvolvimento de negócios
    - desenvolvimento de mercado
    - desenvolvimento técnico de mercado
    - desenvolvimento de fornecedores
    - desenvolvimento imobiliário
    - desenvolvimento infantil
    - desenvolvimento educacional
    - desenvolvimento de motoristas
    - desenvolvimento de rede
    - desenvolvimento farmacotécnico
    - desenvolvimento analítico
    - desenvolvimento do cooperativismo
    - desenvolvimento de arte
    - desenvolvimento de projetos de engenharia
    - pesquisa e desenvolvimento
    - desenvolvimento de canais
    - desenvolvimento de embalagem
  security:
    - segurança do trabalho
    - segurança patrimonial
    - segurança predial
    - técnico de segurança
    - segurança alimentar

# Provisional until M7 calibration (docs/04-scoring-model.md). dev and
# security share 1.0 — equal first priorities (docs/01-vision-and-scope.md).
trackWeights:
  dev: 1.0
  security: 1.0
  automation: 0.7
  unknown: 0.4

# Stage C's formula (docs/04-scoring-model.md). Provisional until M7
# calibration — every number here is a starting hypothesis, not a result.
scoring:
  weights:
    mandatory: 65
    desirable: 20
    trackAlignment: 15
  thresholds:
    apply: 70
    review: 45
  # Fewer extracted requirements than this triggers lowConfidence, capping
  # the verdict at review — see docs/04's "empty posting" edge case.
  minExtractedRequirements: 1
  # Score ceiling when a blocking requirement fails (docs/04).
  blockingCapScore: 35

# Two independent crons (ADR-009, M8). Collection is frequent and cheap — no
# LLM. Scoring and delivery run once nightly, in an off-peak window, because
# that is the only point where the model (and its resource cost) runs.
schedule:
  collection:
    intervalHours: 4
  scoreAndDeliver:
    time: "03:00"
    timezone: America/Sao_Paulo

# docs/08-observability.md. Delivered through the same Telegram notifier as
# the digest — a separate alerting channel for a personal project would be
# infrastructure nobody maintains.
alerts:
  # Collection is frequent, so one empty cycle is routine; alert only after
  # this many in a row.
  consecutiveEmptyCollectionRuns: 2
  # Share of scoring attempts failing (ADR-006) in a single deliver run
  # above which the run itself is worth flagging as a possible model or
  # prompt regression.
  scoreFailureRateThreshold: 0.5
